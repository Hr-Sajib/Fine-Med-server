services:
  finemed-server:
    container_name: finemed-server
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - sajib-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  sajib-net:
    external: true
